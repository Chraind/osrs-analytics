# Daily OSRS collector on GitHub Actions.
# Place at:  .github/workflows/collect.yml  in the repo,
# with osrs_collector.R in the repo root.
# The collector writes to ./data, and this workflow commits it back.

name: OSRS collector

on:
  schedule:
    - cron: "17 8 * * *"     # every day 08:17 UTC (10:17 Danish summer time)
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # needed to commit the new data

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # fast binary packages on Linux

      - name: Install packages
        run: Rscript -e 'install.packages(c("httr","jsonlite"))'

      - name: Run collector
        run: Rscript osrs_collector.R

      - name: Commit new data
        run: |
          git config user.name  "osrs-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
